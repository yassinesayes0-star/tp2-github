<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="controle.js"></script>
</head>
<body>
    <form action="#" method="post" onsubmit="verif()">
        <h1>Inscription au club sportif</h1>

        <fieldset>
            <legend>Informations personnelles</legend>


            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="ex" :dupont autofocus tabindex="1">

            <label for="nom">email</label>
            <input type="text" id="email" name="email" placeholder="ex" :mariem@gmail.com tabindex="2">

            <label for="nom">Telephone</label>
            <input type="text" id="Tel" name="nom" placeholder="ex" : 0612345678 pattern="^(0|\+33)[1-9](-. ]?[0-9]{2}){4}$" >


            <label for="nom">mot de passe</label>
            <input type="text" id="mdp" name="mdp" placeholder="ex" >

        </fieldset>

         <fieldset>
            <legend>votre profil sportif</legend>
            <label for="sport">sport pratique</label>
            <select name="sport" id="sport">
            <optgroup label="Sport collectifs">
                <option value="football">football</option>
                <option value="basketball">basketball</option>
            </optgroup>
            <optgroup label="Sport individuel">
                <option value="natation">Natation</option>
                <option value="yoga">Yoga</option>
            </optgroup>
        </select>
        <label for="ville">Votre ville</label>
        <input type="text" name="ville" id="ville" list="villes">
        <datalist id="villes">
            <option value="paris"></option>
            <option value="lyon"></option>
            <option value="marseille"></option>
        </datalist>
        <label >Niveau *</label>
        <input type="radio" name="niveau" value="debutant" id="n1" checked>
        <label for="n1">Debutant</label>
        <input type="radio" name="niveau" value="intermidaire" id="n2">
        <label for="n2">Intermidaire</label>
        <input type="radio" name="niveau" id="n3" value="confirme">
        <label for="n3">Confirme</label>

        <label for="">Créneaux souhaités</label>
        <input type="checkbox" name="creneau" id="c1" value="matin">
        <label for="c1">Matin</label>
        <input type="checkbox" name="Apré_midi" id="c2" value="Apré_midi">
        <label for="c2">Apré_midi</label>
        <input type="checkbox" name="soir" id="c3" value="soir">
        <label for="c3">Soir</label>
        <input type="checkbox" name="Week-end" id="c4" value="Week-end">
        <label for="c4">Week-end</label>
        </fieldset>

        <fieldset>
            <legend>validation</legend>

            <label for="">date de naissance<input type="date" id="naissance" name="naissance"></label>

            <label for="bio">Presentez-vous 
                <textarea name="bio" id="bio" rows="4" maxlength="200 " placeholder="parlez-nous de vous"></textarea>
            </label>

            <label for="experiance">Annes experiance</label>
            <input type="number" id="experiance" name="experiance" min="0" max="50">

        </fieldset>

        <p class="errur" id="errur-mdp" style="display: none; color: #d64545;" >
            Les Deux mots de passe ne correspondent pas.
        </p>

    </form>
    


   


</body>
</html>
